name: CI

on:
  push:
    branches: [main, stage2-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      PUBLIC_BASE_URL: http://localhost:8000
      DATABASE_PATH: ./ci_clearpath.db
      TOOL_API_KEY: ci-tool-key
      EVENT_API_KEY: ci-event-key
      ADMIN_API_KEY: ci-admin-key
      ACTION_SIGNING_SECRET: ci-action-signing-secret
      AUDIT_SIGNING_SECRET: ci-audit-signing-secret
      ELEVENLABS_WEBHOOK_SECRET: ci-elevenlabs-webhook-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed synthetic data
        run: python -m scripts.seed

      - name: Run tests
        run: pytest -q

      - name: Compile application
        run: python -m compileall -q app scripts tests

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify production image builds
        run: docker build -t clearpath-voice:ci .

  live-health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify hosted Railway deployment
        env:
          HEALTH_URL: https://clearpath-voice-production-36b5.up.railway.app/health
          DEMO_URL: https://clearpath-voice-production-36b5.up.railway.app/demo
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health_code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            demo_code=$(curl -sS -o /tmp/demo.html -w "%{http_code}" "$DEMO_URL" || true)
            if [ "$health_code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json && [ "$demo_code" = "200" ]; then
              echo "Hosted deployment healthy"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt/20: health=$health_code demo=$demo_code; waiting for deployment..."
            sleep 15
          done
          echo "Hosted deployment did not become healthy in time"
          cat /tmp/health.json || true
          exit 1
